name: compose
on:
  push:
    branches: ['compose-*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.j.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: j
        run: echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
  compose:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p node && cd node && npm init -y >/dev/null && npm i -s @fontsource/noto-sans @fontsource/noto-sans-arabic playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: compose
        env:
          WODDI_NM: ${{ github.workspace }}/node/node_modules/@fontsource
          WODDI_PW: ${{ github.workspace }}/node/node_modules/playwright
        run: |
          set -o pipefail
          python3 comp/compose.py ${{ matrix.c }} ${{ matrix.m }} ${{ matrix.l }} out/v2/${{ matrix.l }}/${{ matrix.c }} 2>&1 | tail -20
          test -f out/v2/${{ matrix.l }}/${{ matrix.c }}/${{ matrix.m }}.mp4
          rm -rf out/v2/${{ matrix.l }}/${{ matrix.c }}/_w_*
      - name: publish
        run: |
          cd out && git init -q && B="vidout-${GITHUB_REF_NAME#compose-}-${{ matrix.l }}-${{ matrix.c }}-${{ matrix.m }}" && git checkout -q -b "$B" && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm video && \
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
