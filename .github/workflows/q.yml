name: sb-probe
on:
  push:
    branches: ['sb-probe']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for h in aws-0-eu-west-1.pooler.supabase.com aws-1-eu-west-1.pooler.supabase.com; do for port in 5432 6543; do
            echo "== $h:$port" >> out/r.txt
            PGPASSWORD=wrongpass PGCONNECT_TIMEOUT=10 psql "host=$h port=$port user=postgres.hghezktzbepikpjzlxwe dbname=postgres sslmode=require" -c "select 1" >> out/r.txt 2>&1 || true
          done; done
          echo "== direct" >> out/r.txt
          PGPASSWORD=wrongpass PGCONNECT_TIMEOUT=10 psql "host=db.hghezktzbepikpjzlxwe.supabase.co port=5432 user=postgres dbname=postgres sslmode=require" -c "select 1" >> out/r.txt 2>&1 || true
          cd out && git init -q && git checkout -q -b sb-probe-out && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm out && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sb-probe-out
