name: render
on:
  push:
    branches: ['render-*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.j.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: j
        run: echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
  render:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          pip install -q bpy
          git clone -q --depth 1 -b job-assets-out https://github.com/${{ github.repository }}.git assets
          cp gen/*.png assets/
      - name: render
        env:
          WODDI_ASSETS: ${{ github.workspace }}/assets
          WODDI_VARIANT: ${{ matrix.v }}
          WODDI_SAMPLES: '9'
          WODDI_PART: ${{ matrix.p }}
          WODDI_PARTS: ${{ matrix.n }}
        run: |
          python render_demo.py ${{ matrix.demo }} frames 2>&1 | grep -E "RENDERED|Error|Traceback" || true
          ls frames | wc -l
      - name: publish frames
        run: |
          mkdir out && cp frames/*.jpg out/
          cd out && git init -q && B="frames-${GITHUB_REF_NAME#render-}-${{ matrix.demo }}-v${{ matrix.v }}-p${{ matrix.p }}" && git checkout -q -b "$B" && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm frames && \
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$B"
