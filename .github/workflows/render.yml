name: render
on:
  push:
    branches: ['render-r4*', 'render-r5*', 'render-r6*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.j.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: j
        run: echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "clips-${GITHUB_REF_NAME#render-}" -R ${{ github.repository }} --title "3D clips ${GITHUB_REF_NAME#render-}" --notes "Rendered demonstration clips (original WODDI scenes)." || true
  render:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q bpy
          git clone -q --depth 1 -b job-assets-out https://github.com/${{ github.repository }}.git assets
          git clone -q --depth 1 -b job-assets2-out https://github.com/${{ github.repository }}.git assets2
          cp -rn assets2/ph/* assets/ph/ ; cp -rn assets2/ph/hdri/* assets/ph/hdri/ 2>/dev/null; cp -rn assets2/ph/tex/* assets/ph/tex/ 2>/dev/null
          cp gen/*.png assets/
      - name: render
        env:
          WODDI_ASSETS: ${{ github.workspace }}/assets
          WODDI_SCREENS: ${{ github.workspace }}/screens
          WODDI_VARIANT: ${{ matrix.v }}
          WODDI_SAMPLES: '10'
          WODDI_STEP: '2'
        run: |
          python render_demo.py ${{ matrix.demo }} frames 2>&1 | grep -E "RENDERED|Error|Traceback|missing" || true
          N=$(ls frames | wc -l); echo "frames $N"; test "$N" -ge 90
          ffmpeg -nostdin -v error -y -framerate 12 -pattern_type glob -i 'frames/*.jpg' -vf "minterpolate=fps=24:mi_mode=blend,format=yuv420p" -c:v libx264 -preset slow -crf 16 "${{ matrix.demo }}-v${{ matrix.v }}.mp4"
          ls -la *.mp4
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do gh release upload "clips-${GITHUB_REF_NAME#render-}" "${{ matrix.demo }}-v${{ matrix.v }}.mp4" --clobber -R ${{ github.repository }} && break; sleep $((i*7)); done
