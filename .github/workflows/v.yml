name: guide-voice
on:
  push:
    branches: ['guide-voice']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fr, pt, ar, sw, ha, yo, ig]
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "${{ matrix.lang }}" = "ha" ] || [ "${{ matrix.lang }}" = "yo" ] || [ "${{ matrix.lang }}" = "ig" ]; then
            pip install -q scipy numpy transformers sentencepiece && pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          else pip install -q edge-tts; fi
          mkdir -p out && timeout 1800 python tts.py ${{ matrix.lang }} || true
          cd out && zip -qr ../voice-${{ matrix.lang }}.zip . && cd ..
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create guide-voice --repo ${{ github.repository }} --title guide-voice --notes voices 2>/dev/null || true
          gh release upload guide-voice voice-${{ matrix.lang }}.zip --clobber --repo ${{ github.repository }}
