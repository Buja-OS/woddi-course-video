name: compose2
on:
  push:
    branches: ['compose2-*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.j.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: jobs.json
      - id: j
        run: echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
  compose:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p node && cd node && npm init -y >/dev/null && npm i -s @fontsource/noto-sans @fontsource/noto-sans-arabic playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: compose and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WODDI_NM: ${{ github.workspace }}/node/node_modules/@fontsource
          WODDI_PW: ${{ github.workspace }}/node/node_modules/playwright
        run: bash run_course.sh ${{ matrix.c }} ${{ github.repository }} "${{ matrix.l }}" 2>&1 | grep -vE "^\s*$" | tail -150
