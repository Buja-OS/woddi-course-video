name: promo-voice-186
on:
  push:
    branches: ['promo-voice-186']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -q edge-tts
          timeout 900 python tts.py 2>&1 | tee run.log || true
          mkdir -p out && cp run.log out/
      - if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b promo-voice-186-out && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm out --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" promo-voice-186-out
