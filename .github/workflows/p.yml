name: promo-voice-186
on:
  push:
    branches: ['promo-voice-186']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node -e "console.log(process.version)"
          timeout 1200 node run.js 2>&1 | tee out-run.log || true
          mkdir -p out && cp out-run.log out/ || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b promo-voice-186-out && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" promo-voice-186-out
