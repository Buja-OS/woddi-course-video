name: voice-probe
on:
  push:
    branches: ['voice-probe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node probe.js || true
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create voice-probe --repo ${{ github.repository }} --title voice-probe --notes probe 2>/dev/null || true
          gh release upload voice-probe out/* --clobber --repo ${{ github.repository }}
