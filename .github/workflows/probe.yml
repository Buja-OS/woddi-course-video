name: live-check
on:
  push:
    branches: ['live-check']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node live.mjs > result.txt 2>&1 || true; cat result.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create live-check --repo ${{ github.repository }} --title live-check --notes x 2>/dev/null || true
          gh release upload live-check shots/* result.txt --clobber --repo ${{ github.repository }}
