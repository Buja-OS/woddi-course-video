name: probe
on:
  push:
    branches: ['probe-*']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py > result.txt 2>&1 || true; tail -c 60000 result.txt
      - run: |
          git config user.email bot@x; git config user.name bot
          git add result.txt; git commit -qm result; git push -q origin HEAD:${GITHUB_REF_NAME}
