name: wan-test
on:
  push:
    branches: ['wan-*']
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shot: [nitrosol, ph]
    steps:
      - uses: actions/checkout@v4
      - run: nproc; free -g; df -h / | tail -1
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q "diffusers>=0.33" transformers accelerate ftfy imageio imageio-ffmpeg sentencepiece
      - run: python3 wan.py ${{ matrix.shot }} 2>&1 | tail -40
      - if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out || true
          gh release create wan-test --repo ${{ github.repository }} --title wan-test --notes test 2>/dev/null || true
          gh release upload wan-test out/* --clobber --repo ${{ github.repository }} || true
