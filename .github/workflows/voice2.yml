name: voice2
on:
  push:
    branches: ['voice2-*']
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.j.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: jobs.json
      - id: j
        run: echo "jobs=$(cat jobs.json)" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: for L in en fr pt ar yo ha ig sw; do gh release create "voice2-$L" -R ${{ github.repository }} --title "Narration $L" --notes "Narration audio per course (opus)." || true; done
  voice:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: |
          sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          L=${{ matrix.lang }}
          if [ "$L" = en ] || [ "$L" = fr ] || [ "$L" = pt ]; then
            pip install -q kokoro-onnx soundfile numpy
            curl -sSfL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            curl -sSfL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          else
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q "transformers<4.50" soundfile numpy uroman num2words huggingface_hub
            if [ "$L" = yo ] || [ "$L" = ig ]; then pip install -q coqui-tts; fi
          fi
      - name: narrate
        run: python tts/voice2.py ${{ matrix.lang }} scripts out ${{ matrix.courses }} 2>&1 | grep -E "voiced|error|Error|Traceback" | tail -400
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          for c in *; do tar -cf "../${c}.tar" "$c"; done
          cd ..
          for c in ${{ matrix.courses }}; do
            [ -f "$c.tar" ] || { echo "MISSING $c"; continue; }
            for i in 1 2 3 4 5; do gh release upload "voice2-${{ matrix.lang }}" "$c.tar" --clobber -R ${{ github.repository }} && break; sleep $((i*9)); done
          done
